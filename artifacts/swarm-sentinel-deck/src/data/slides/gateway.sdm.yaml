format: "replit.sdm"
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: "solid"
  color:
    kind: "token"
    token: "background"
theme:
  colors:
    background: "#0c1118"
    foreground: "#e0e6eb"
    surface: "#121821"
    muted: "#919dac"
    accent: "#29bc86"
    border: "#222a35"
    danger: "#e74640"
  fonts:
    display: "IBM Plex Sans"
    body: "IBM Plex Sans"
    mono: "JetBrains Mono"
elements:
  - 
    id: "titleAccent"
    type: "shape"
    frame:
      x: 120
      y: 90
      width: 72
      height: 6
    geometry:
      kind: "preset"
      preset: "rect"
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "accent"
      opacity: 1
  - 
    id: "title"
    type: "text"
    frame:
      x: 120
      y: 130
      width: 1680
      height: 140
    body:
      paragraphs:
        - 
          runs:
            - 
              text: "Design: runtime policy gateway"
          defaultRunStyle:
            font:
              kind: "token"
              token: "display"
            sizePt: 38
            weight: 600
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.1
          spaceAfterPt: 0
  - 
    id: "footerRule"
    type: "shape"
    frame:
      x: 120
      y: 1013
      width: 1680
      height: 2
    geometry:
      kind: "preset"
      preset: "rect"
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "border"
      opacity: 1
  - 
    id: "footer"
    type: "text"
    frame:
      x: 120
      y: 1028
      width: 850
      height: 40
    body:
      paragraphs:
        - 
          runs:
            - 
              text: "SwarmSentinel"
          defaultRunStyle:
            font:
              kind: "token"
              token: "mono"
            sizePt: 15
            weight: 400
            color:
              kind: "token"
              token: "muted"
          lineHeight: 1.2
          spaceAfterPt: 0
  - 
    id: "page"
    type: "text"
    frame:
      x: 1670
      y: 1028
      width: 130
      height: 40
    body:
      paragraphs:
        - 
          runs:
            - 
              text: "04 / 08"
          defaultRunStyle:
            font:
              kind: "token"
              token: "mono"
            sizePt: 15
            weight: 400
            color:
              kind: "token"
              token: "muted"
          lineHeight: 1.2
          spaceAfterPt: 0
  - 
    id: "bodyPanel"
    type: "shape"
    frame:
      x: 450
      y: 300
      width: 1350
      height: 675
    geometry:
      kind: "preset"
      preset: "rect"
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "surface"
      opacity: 1
  - 
    id: "sectionIndex"
    type: "text"
    frame:
      x: 120
      y: 320
      width: 270
      height: 200
    body:
      paragraphs:
        - 
          runs:
            - 
              text: "03"
          defaultRunStyle:
            font:
              kind: "token"
              token: "display"
            sizePt: 64
            weight: 600
            color:
              kind: "token"
              token: "accent"
          lineHeight: 1.1
          spaceAfterPt: 0
  - 
    id: "body"
    type: "text"
    frame:
      x: 490
      y: 335
      width: 1260
      height: 595
    body:
      paragraphs:
        - 
          runs:
            - 
              text: "Admit agent identities and validate parent-span lineage"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 21
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.2
          spaceAfterPt: 16
          bullet:
            kind: "character"
            character: "•"
          markerStyle:
            color:
              kind: "token"
              token: "accent"
        - 
          runs:
            - 
              text: "Default recursion-depth cap: 4 hops"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 21
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.2
          spaceAfterPt: 16
          bullet:
            kind: "character"
            character: "•"
          markerStyle:
            color:
              kind: "token"
              token: "accent"
        - 
          runs:
            - 
              text: "Throttle the fifth matching intent and target across at least 3 agent IDs within 10 seconds"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 21
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.2
          spaceAfterPt: 16
          bullet:
            kind: "character"
            character: "•"
          markerStyle:
            color:
              kind: "token"
              token: "accent"
        - 
          runs:
            - 
              text: "Default mock-write cap: 6 writes per target per 10 seconds"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 21
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.2
          spaceAfterPt: 16
          bullet:
            kind: "character"
            character: "•"
          markerStyle:
            color:
              kind: "token"
              token: "accent"
        - 
          runs:
            - 
              text: "Deny tools outside the explicit mock allowlist"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 21
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.2
          spaceAfterPt: 16
          bullet:
            kind: "character"
            character: "•"
          markerStyle:
            color:
              kind: "token"
              token: "accent"
