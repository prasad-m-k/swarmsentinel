format: "replit.sdm"
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: "solid"
  color:
    kind: "token"
    token: "background"
theme:
  colors:
    background: "#0c1118"
    foreground: "#e0e6eb"
    surface: "#121821"
    muted: "#919dac"
    accent: "#29bc86"
    border: "#222a35"
    danger: "#e74640"
  fonts:
    display: "IBM Plex Sans"
    body: "IBM Plex Sans"
    mono: "JetBrains Mono"
elements:
  - 
    id: "titleAccent"
    type: "shape"
    frame:
      x: 120
      y: 90
      width: 72
      height: 6
    geometry:
      kind: "preset"
      preset: "rect"
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "accent"
      opacity: 1
  - 
    id: "title"
    type: "text"
    frame:
      x: 120
      y: 130
      width: 1680
      height: 140
    body:
      paragraphs:
        - 
          runs:
            - 
              text: "Problem: runaway coordination"
          defaultRunStyle:
            font:
              kind: "token"
              token: "display"
            sizePt: 38
            weight: 600
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.1
          spaceAfterPt: 0
  - 
    id: "footerRule"
    type: "shape"
    frame:
      x: 120
      y: 1013
      width: 1680
      height: 2
    geometry:
