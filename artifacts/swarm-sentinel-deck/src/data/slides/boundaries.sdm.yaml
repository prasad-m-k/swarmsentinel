format: "replit.sdm"
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: "solid"
  color:
    kind: "token"
    token: "background"
theme:
  colors:
    background: "#0c1118"
    foreground: "#e0e6eb"
    surface: "#121821"
    muted: "#919dac"
    accent: "#29bc86"
    border: "#222a35"
    danger: "#e74640"
  fonts:
    display: "IBM Plex Sans"
    body: "IBM Plex Sans"
    mono: "JetBrains Mono"
elements:
  - 
    id: "titleAccent"
    type: "shape"
    frame:
      x: 120
      y: 90
      width: 72
      height: 6
    geometry:
      kind: "preset"
      preset: "rect"
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "accent"
      opacity: 1
  - 
    id: "title"
    type: "text"
    frame:
      x: 120
      y: 130
      width: 1680
      height: 140
    body:
      paragraphs:
        - 
          runs:
            - 
              text: "Architecture: prototype boundaries"
          defaultRunStyle:
            font:
              kind: "token"
              token: "display"
            sizePt: 38
            weight: 600
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.1
          spaceAfterPt: 0
  - 
    id: "footerRule"
    type: "shape"
    frame:
      x: 120
      y: 1013
      width: 1680
      height: 2
    geometry:
      kind: "preset"
      preset: "rect"
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "border"
      opacity: 1
  - 
    id: "footer"
    type: "text"
    frame:
      x: 120
      y: 1028
      width: 850
      height: 40
    body:
      paragraphs:
        - 
          runs:
            - 
              text: "SwarmSentinel"
          defaultRunStyle:
            font:
              kind: "token"
              token: "mono"
            sizePt: 15
            weight: 400
            color:
              kind: "token"
              token: "muted"
          lineHeight: 1.2
          spaceAfterPt: 0
  - 
    id: "page"
    type: "text"
    frame:
      x: 1670
      y: 1028
      width: 130
      height: 40
    body:
      paragraphs:
        - 
          runs:
            - 
              text: "08 / 08"
          defaultRunStyle:
            font:
              kind: "token"
              token: "mono"
            sizePt: 15
            weight: 400
            color:
              kind: "token"
              token: "muted"
          lineHeight: 1.2
          spaceAfterPt: 0
  - 
    id: "currentPanel"
    type: "shape"
    frame:
      x: 120
      y: 310
      width: 820
      height: 665
    geometry:
      kind: "preset"
      preset: "rect"
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "surface"
      opacity: 1
  - 
    id: "boundaryPanel"
    type: "shape"
    frame:
      x: 980
      y: 310
      width: 820
      height: 665
    geometry:
      kind: "preset"
      preset: "rect"
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "surface"
      opacity: 1
  - 
    id: "current"
    type: "text"
    frame:
      x: 160
      y: 355
      width: 730
      height: 600
    body:
      paragraphs:
        - 
          runs:
            - 
              text: "FastAPI + Pydantic validate requests; NetworkX analyzes interactions"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 21
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.2
          spaceAfterPt: 20
          bullet:
            kind: "character"
            character: "•"
          markerStyle:
            color:
              kind: "token"
              token: "accent"
        - 
          runs:
            - 
              text: "NumPy supports deterministic intent fingerprints, not semantic embeddings"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 21
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.2
          spaceAfterPt: 20
          bullet:
            kind: "character"
            character: "•"
          markerStyle:
            color:
              kind: "token"
              token: "accent"
        - 
          runs:
            - 
              text: "Tools and agent actions are synthetic mocks; no external execution"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 21
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.2
          spaceAfterPt: 20
          bullet:
            kind: "character"
            character: "•"
          markerStyle:
            color:
              kind: "token"
              token: "accent"
  - 
    id: "boundary"
    type: "text"
    frame:
      x: 1020
      y: 355
      width: 730
      height: 560
    body:
      paragraphs:
        - 
          runs:
            - 
              text: "Policy and recorder are separate modules in one prototype process"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 21
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.2
          spaceAfterPt: 20
          bullet:
            kind: "character"
            character: "•"
          markerStyle:
            color:
              kind: "token"
              token: "accent"
        - 
          runs:
            - 
              text: "Production hardening would require isolated enforcement and durable telemetry"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 21
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.2
          spaceAfterPt: 20
          bullet:
            kind: "character"
            character: "•"
          markerStyle:
            color:
              kind: "token"
              token: "accent"
