format: "replit.sdm"
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: "solid"
  color:
    kind: "token"
    token: "background"
theme:
  colors:
    background: "#0c1118"
    foreground: "#e0e6eb"
    surface: "#121821"
    muted: "#919dac"
    accent: "#29bc86"
    border: "#222a35"
    danger: "#e74640"
  fonts:
    display: "IBM Plex Sans"
    body: "IBM Plex Sans"
    mono: "JetBrains Mono"
elements:
  - 
    id: "coverPanel"
    type: "shape"
    frame:
      x: 1490
      y: 0
      width: 430
      height: 1080
    geometry:
      kind: "preset"
      preset: "rect"
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "accent"
      opacity: 0.1
  - 
    id: "titleAccent"
    type: "shape"
    frame:
      x: 120
      y: 90
      width: 72
      height: 6
    geometry:
      kind: "preset"
      preset: "rect"
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "accent"
      opacity: 1
  - 
    id: "title"
    type: "text"
    frame:
      x: 120
      y: 310
      width: 1680
      height: 230
    body:
      paragraphs:
        - 
          runs:
            - 
              text: "SwarmSentinel"
          defaultRunStyle:
            font:
              kind: "token"
              token: "display"
            sizePt: 64
            weight: 600
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.1
          spaceAfterPt: 0
  - 
    id: "footerRule"
    type: "shape"
    frame:
      x: 120
      y: 1013
      width: 1680
      height: 2
    geometry:
      kind: "preset"
      preset: "rect"
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "border"
      opacity: 1
  - 
    id: "footer"
    type: "text"
    frame:
      x: 120
      y: 1028
      width: 850
      height: 40
    body:
      paragraphs:
        - 
          runs:
            - 
              text: "SwarmSentinel"
          defaultRunStyle:
            font:
              kind: "token"
              token: "mono"
            sizePt: 15
            weight: 400
            color:
              kind: "token"
              token: "muted"
          lineHeight: 1.2
          spaceAfterPt: 0
  - 
    id: "page"
    type: "text"
    frame:
      x: 1670
      y: 1028
      width: 130
      height: 40
    body:
      paragraphs:
        - 
          runs:
            - 
              text: "01 / 08"
          defaultRunStyle:
            font:
              kind: "token"
              token: "mono"
            sizePt: 15
            weight: 400
            color:
              kind: "token"
              token: "muted"
          lineHeight: 1.2
          spaceAfterPt: 0
  - 
    id: "subtitle"
    type: "text"
    frame:
      x: 120
      y: 610
      width: 1400
      height: 245
    body:
      paragraphs:
        - 
          runs:
            - 
              text: "AI Swarm Dynamics Hackathon"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 24
            weight: 600
            color:
              kind: "token"
              token: "accent"
          lineHeight: 1.2
          spaceAfterPt: 20
        - 
          runs:
            - 
              text: "ASP-inspired runtime policies + a multi-agent incident flight recorder"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 24
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.2
          spaceAfterPt: 0
