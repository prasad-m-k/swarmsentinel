format: "replit.sdm"
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: "solid"
  color:
    kind: "token"
    token: "background"
theme:
  colors:
    background: "#0c1118"
    foreground: "#e0e6eb"
    surface: "#121821"
    muted: "#919dac"
    accent: "#29bc86"
    border: "#222a35"
    danger: "#e74640"
  fonts:
    display: "IBM Plex Sans"
    body: "IBM Plex Sans"
    mono: "JetBrains Mono"
elements:
  - 
    id: "titleAccent"
    type: "shape"
    frame:
      x: 120
      y: 90
      width: 72
      height: 6
    geometry:
      kind: "preset"
      preset: "rect"
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "accent"
      opacity: 1
  - 
    id: "title"
    type: "text"
    frame:
      x: 120
      y: 130
      width: 1680
      height: 140
    body:
      paragraphs:
        - 
          runs:
            - 
              text: "Design: flight recorder and dashboard"
          defaultRunStyle:
            font:
              kind: "token"
              token: "display"
            sizePt: 38
            weight: 600
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.1
          spaceAfterPt: 0
  - 
    id: "footerRule"
    type: "shape"
    frame:
      x: 120
      y: 1013
      width: 1680
      height: 2
    geometry:
      kind: "preset"
      preset: "rect"
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "border"
      opacity: 1
  - 
    id: "footer"
    type: "text"
    frame:
      x: 120
      y: 1028
      width: 850
      height: 40
    body:
      paragraphs:
        - 
          runs:
            - 
              text: "SwarmSentinel"
          defaultRunStyle:
            font:
              kind: "token"
              token: "mono"
            sizePt: 15
            weight: 400
            color:
              kind: "token"
              token: "muted"
          lineHeight: 1.2
          spaceAfterPt: 0
  - 
    id: "page"
    type: "text"
    frame:
      x: 1670
      y: 1028
      width: 130
      height: 40
    body:
      paragraphs:
        - 
          runs:
            - 
              text: "05 / 08"
          defaultRunStyle:
            font:
              kind: "token"
              token: "mono"
            sizePt: 15
            weight: 400
            color:
              kind: "token"
              token: "muted"
          lineHeight: 1.2
          spaceAfterPt: 0
  - 
    id: "body"
    type: "text"
    frame:
      x: 120
      y: 300
      width: 850
      height: 685
    body:
      paragraphs:
        - 
          runs:
            - 
              text: "Capture actor, parent, span, intent, target, decision, and policy version"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 21
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.2
          spaceAfterPt: 12
          bullet:
            kind: "character"
            character: "•"
          markerStyle:
            color:
              kind: "token"
              token: "accent"
        - 
          runs:
            - 
              text: "Distinguish allowed, throttled, dropped, and out-of-band observed events"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 21
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.2
          spaceAfterPt: 12
          bullet:
            kind: "character"
            character: "•"
          markerStyle:
            color:
              kind: "token"
              token: "accent"
        - 
          runs:
            - 
              text: "Show executed interactions separately from blocked attempts"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 21
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.2
          spaceAfterPt: 12
          bullet:
            kind: "character"
            character: "•"
          markerStyle:
            color:
              kind: "token"
              token: "accent"
        - 
          runs:
            - 
              text: "Replay the directed graph and enforcement feed through a timeline"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 21
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.2
          spaceAfterPt: 12
          bullet:
            kind: "character"
            character: "•"
          markerStyle:
            color:
              kind: "token"
              token: "accent"
        - 
          runs:
            - 
              text: "Export Markdown reports and provenance-aware JSON traces"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 21
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.2
          spaceAfterPt: 12
          bullet:
            kind: "character"
            character: "•"
          markerStyle:
            color:
              kind: "token"
              token: "accent"
  - 
    id: "imageFrame"
    type: "shape"
    frame:
      x: 1020
      y: 375
      width: 800
      height: 500
    geometry:
      kind: "preset"
      preset: "rect"
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "surface"
      opacity: 1
  - 
    id: "dashboard"
    type: "image"
    frame:
      x: 1040
      y: 395
      width: 760
      height: 456
    assetId: "dashboard"
    fit: "contain"
assets:
  dashboard:
    src: "images/dashboard.jpg"
