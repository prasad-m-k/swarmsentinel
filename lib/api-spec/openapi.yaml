openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /swarm/simulate:
    post:
      operationId: simulateSwarm
      tags: [swarm]
      summary: Replay a synthetic scenario (enforce) or an AI Village window (report-only) through ASP and Sentinel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunInput"
      responses:
        "200":
          description: Recorded simulation and forensic report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwarmRun"
  /swarm/sources:
    get:
      operationId: getSwarmSources
      tags: [swarm]
      summary: Data sources, indexed AI Village episodes, and ASP policy declarations
      responses:
        "200":
          description: Available sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwarmSources"
  /swarm/sessions:
    post:
      operationId: createSwarmSession
      tags: [swarm]
      summary: Start a live session (stateful gateway and Sentinel, enforce mode)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionInput" }
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionCreated" }
  /swarm/sessions/{sessionId}/evaluate:
    post:
      operationId: evaluateSwarmCall
      tags: [swarm]
      summary: Decide one proposed agent action before it executes
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CallInput" }
      responses:
        "200":
          description: Decision; allowed=false means the agent must not execute the call
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallDecision" }
        "404": { description: Unknown or expired session }
  /swarm/sessions/{sessionId}:
    get:
      operationId: getSwarmSession
      tags: [swarm]
      summary: Snapshot of a live session as a run record
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Live run record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SwarmRun" }
        "404": { description: Unknown or expired session }
    delete:
      operationId: deleteSwarmSession
      tags: [swarm]
      summary: End a live session
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "404": { description: Unknown or expired session }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    RunInput:
      type: object
      required: [scenario, feedbackEnabled]
      properties:
        scenario: { type: string, enum: [normal, attack, injection, ai-village] }
        feedbackEnabled: { type: boolean }
        maxDepth: { type: integer, minimum: 1, maximum: 10, description: Defaults to the scenario policy }
        semanticLimit: { type: integer, minimum: 2, maximum: 20, description: Defaults to the scenario policy }
        writeLimit: { type: integer, minimum: 1, maximum: 60, description: Defaults to the scenario policy }
        episodeId: { type: string, description: Indexed AI Village episode to replay }
        start: { type: string, description: UTC start of an AI Village window (with end; max 24 hours) }
        end: { type: string }
        maxEvents: { type: integer, minimum: 10, maximum: 20000, default: 5000 }
    Trace:
      type: object
      required: [id, timestamp, agentId, parentId, spanId, parentSpanId, action, channel, target, intent, intentVector, depth, decision, rule, reason, executed, policyVersion]
      properties:
        id: { type: string }
        timestamp: { type: string }
        agentId: { type: string }
        parentId: { type: string }
        spanId: { type: string }
        parentSpanId: { type: string }
        action: { type: string, enum: [spawn, tool, message, wiki_edit] }
        channel: { type: string, enum: [in_band, out_of_band] }
        target: { type: string }
        intent: { type: string }
        intentVector: { type: array, items: { type: number } }
        depth: { type: integer }
        decision: { type: string, enum: [allow, throttle, drop, observed] }
        rule: { type: string }
        reason: { type: string }
        executed: { type: boolean }
        policyVersion: { type: integer }
        source: { type: string, enum: [synthetic, ai-village, live] }
        sourceRef: { type: string, description: "table:row-id in the source dataset" }
        detail: { type: string }
        network: { type: string }
        reads: { type: string, enum: ["", high, medium, low, untrusted] }
        write: { type: [boolean, "null"] }
        resource: { type: string }
        mentions: { type: array, items: { type: string } }
        mode: { type: string, enum: [enforce, report-only] }
        violations: { type: array, items: { $ref: "#/components/schemas/Violation" } }
        contaminated: { type: boolean }
        taintOrigin: { type: string, description: Event id of the untrusted read this context descends from; empty if clean }
        scope: { type: array, items: { type: string }, description: "Spawn only: tool patterns delegated to the child" }
    Violation:
      type: object
      required: [directive, attempted_action, enforced]
      properties:
        directive: { type: string }
        attempted_action: { type: string }
        detail: { type: string }
        enforced: { type: boolean }
    SwarmAlert:
      type: object
      required: [id, timestamp, kind, reason, agents, eventId]
      properties:
        id: { type: string }
        timestamp: { type: string }
        kind: { type: string }
        reason: { type: string }
        agents: { type: array, items: { type: string } }
        eventId: { type: string }
    PolicyChange:
      type: object
      required: [timestamp, version, blockedAgents, reason]
      properties:
        timestamp: { type: string }
        version: { type: integer }
        blockedAgents: { type: array, items: { type: string } }
        reason: { type: string }
    SwarmRun:
      type: object
      required: [id, scenario, provenance, events, alerts, policies, report, rootAgent, startedAt]
      properties:
        id: { type: string }
        scenario: { type: string }
        provenance: { type: string }
        events: { type: array, items: { $ref: "#/components/schemas/Trace" } }
        alerts: { type: array, items: { $ref: "#/components/schemas/SwarmAlert" } }
        policies: { type: array, items: { $ref: "#/components/schemas/PolicyChange" } }
        report: { type: string }
        rootAgent: { type: string }
        startedAt: { type: string }
        source: { type: string, enum: [synthetic, ai-village, live] }
        mode: { type: string, enum: [enforce, report-only] }
        policyName: { type: string }
        policy: { type: object, additionalProperties: true }
        window: { oneOf: [{ $ref: "#/components/schemas/ReplayWindow" }, { type: "null" }] }
        summary: { $ref: "#/components/schemas/RunSummary" }
        edges:
          type: array
          description: Executed interactions collapsed to one edge per directed pair, heaviest first
          items: { $ref: "#/components/schemas/WeightedEdge" }
    WeightedEdge:
      type: object
      required: [source, target, weight, actions, first, last]
      properties:
        source: { type: string }
        target: { type: string }
        weight: { type: integer, description: Number of executed actions from source to target }
        actions: { type: object, additionalProperties: { type: integer }, description: Weight broken down by action type }
        first: { type: string }
        last: { type: string }
    ReplayWindow:
      type: object
      required: [dataset, exportedAt, citation, start, end, truncated, day, regime]
      properties:
        dataset: { type: string }
        exportedAt: { type: string }
        citation: { type: string }
        start: { type: string }
        end: { type: string }
        truncated: { type: boolean }
        episodeId: { type: [string, "null"] }
        day: { type: string }
        regime: { type: string }
    RunSummary:
      type: object
      required: [decisions, blockedByRule, advisories, alertsByKind, agents, writes, contaminatedWrites, networkHosts, sharedResources]
      properties:
        decisions: { type: object, additionalProperties: { type: integer } }
        blockedByRule: { type: object, additionalProperties: { type: integer } }
        advisories: { type: object, additionalProperties: { type: integer } }
        alertsByKind: { type: object, additionalProperties: { type: integer } }
        agents: { type: integer }
        writes: { type: integer }
        contaminatedWrites: { type: integer }
        networkHosts: { type: object, additionalProperties: { type: integer } }
        sharedResources: { type: object, additionalProperties: { type: integer } }
    Episode:
      type: object
      required: [id, day, start, end, events, alerts, alertsByKind, agents, wouldBlock, score, headline]
      properties:
        id: { type: string }
        day: { type: string }
        start: { type: string }
        end: { type: string }
        events: { type: integer }
        alerts: { type: integer }
        alertsByKind: { type: object, additionalProperties: { type: integer } }
        agents: { type: array, items: { type: string } }
        wouldBlock: { type: integer }
        blockedByRule: { type: object, additionalProperties: { type: integer } }
        resources: { type: array, items: { type: string } }
        score: { type: number }
        headline: { type: string }
    VillageSource:
      type: object
      required: [available, episodes]
      properties:
        available: { type: boolean }
        dataset: { type: string }
        exportedAt: { type: string }
        citation: { type: string }
        range: { type: array, items: { type: string } }
        events: { type: object, additionalProperties: { type: integer } }
        episodes: { type: array, items: { $ref: "#/components/schemas/Episode" } }
    SwarmSources:
      type: object
      required: [aiVillage, policies]
      properties:
        aiVillage: { $ref: "#/components/schemas/VillageSource" }
        policies: { type: object, additionalProperties: { type: object, additionalProperties: true } }
    SessionInput:
      type: object
      properties:
        policy: { type: string, enum: [mock, ai-village], default: mock }
        feedbackEnabled: { type: boolean, default: true }
        root: { type: string, default: orchestrator }
    SessionCreated:
      type: object
      required: [sessionId, policyName, root, feedbackEnabled, policy]
      properties:
        sessionId: { type: string }
        policyName: { type: string }
        root: { type: string }
        feedbackEnabled: { type: boolean }
        policy: { type: object, additionalProperties: true }
    CallInput:
      type: object
      required: [agentId, action, target, spanId]
      properties:
        agentId: { type: string }
        action: { type: string, enum: [spawn, tool, message] }
        target: { type: string }
        intent: { type: string }
        parentId: { type: string }
        spanId: { type: string }
        parentSpanId: { type: string }
        detail: { type: string }
        network: { type: string }
        reads: { type: string, enum: ["", high, medium, low, untrusted] }
        write: { type: [boolean, "null"] }
        resource: { type: string }
        mentions: { type: array, items: { type: string } }
        scope: { type: array, items: { type: string } }
        timestamp: { type: [string, "null"] }
    CallDecision:
      type: object
      required: [eventId, allowed, decision, rule, reason, policyVersion, taintOrigin, violations, alerts, evaluationMs]
      properties:
        eventId: { type: string }
        allowed: { type: boolean }
        decision: { type: string, enum: [allow, throttle, drop, observed] }
        rule: { type: string }
        reason: { type: string }
        policyVersion: { type: integer }
        taintOrigin: { type: string }
        violations: { type: array, items: { $ref: "#/components/schemas/Violation" } }
        alerts: { type: array, items: { $ref: "#/components/schemas/SwarmAlert" } }
        evaluationMs: { type: number }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

